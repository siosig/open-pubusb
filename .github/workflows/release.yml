name: release

# On every `v*` tag push, build the musl release binary, package it as a
# tarball + a combined SHA256SUMS file, publish a GitHub Release
# (softprops/action-gh-release), and build/push a container image (see the
# Dockerfile) to GHCR. Mirrors the job style of ./ci.yml (job names,
# `runs-on: ubuntu-latest`).
#
# Cross-compilation approach: cargo-zigbuild (https://github.com/rust-cross/
# cargo-zigbuild) + zig, installed via the `ziglang` PyPI wheel — the same
# approach used by the Dockerfile, verified working there for
# x86_64-unknown-linux-musl.
#
# x86_64-unknown-linux-musl is the only architecture released.
# aarch64-unknown-linux-musl should build (zig ships its own cross-linker
# and libc, so GitHub's amd64 runners need no QEMU for it), but it has
# never been run against real aarch64 hardware, so it is deliberately not
# published rather than shipped unverified. Re-adding it means putting the
# triple back in this build matrix, restoring `linux/arm64` to the docker
# job's `platforms`, and adding the architecture back to
# `open_pubusb_arch_target_map` in the Ansible role.

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install zig + cargo-zigbuild
        run: |
          pip install --disable-pip-version-check ziglang
          cargo install cargo-zigbuild --locked

      - name: Build release binary
        run: cargo zigbuild --release --target ${{ matrix.target }} -p open-pubusb

      # Archive name and layout are the contract the Ansible role installs
      # from; scripts/release/package.sh owns them (CI's molecule mirror uses
      # the same script).
      - name: Package tarball
        id: package
        run: |
          archive=$(scripts/release/package.sh \
            "target/${{ matrix.target }}/release/open-pubusb" \
            "${GITHUB_REF_NAME#v}" "${{ matrix.target }}" dist)
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"
          echo "checksum=${archive}.sha256" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: open-pubusb-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Assemble SHA256SUMS
        working-directory: dist
        run: |
          cat *.tar.gz.sha256 | sort -k2 > SHA256SUMS
          rm -f *.tar.gz.sha256
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true

  docker:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # No docker/setup-qemu-action: the image is built for linux/amd64
      # only, which is the runner's own architecture, so nothing needs
      # emulating. Restoring linux/arm64 below means restoring QEMU here.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"
          image="ghcr.io/${{ github.repository }}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
