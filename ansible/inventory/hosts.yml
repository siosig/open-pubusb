---
# `open_pubusb` is the group the playbook (site.yml) actually targets.
# Only `localhost` is a member by default so `ansible-playbook ... site.yml`
# works out of the box (and in CI) without reaching any network host.
#
# `open_pubusb_remote_example` is a template showing how to add a real remote
# target: copy its host(s) into the `open_pubusb` group above (or add
# `open_pubusb_remote_example` as a child of `open_pubusb`) once the host is reachable.
all:
  children:
    open_pubusb:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
    open_pubusb_remote_example:
      hosts:
        vm01.example.internal:
          ansible_host: 203.0.113.10
          ansible_user: deploy
