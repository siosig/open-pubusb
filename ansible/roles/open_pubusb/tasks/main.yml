---
- name: Run preflight checks
  ansible.builtin.import_tasks: preflight.yml

- name: Render shared configuration (config.toml)
  ansible.builtin.import_tasks: config.yml

- name: Install and start via systemd
  ansible.builtin.import_tasks: install_systemd.yml
  when: open_pubusb_deploy_mode == 'systemd'

- name: Install and start via Docker
  ansible.builtin.import_tasks: install_docker.yml
  when: open_pubusb_deploy_mode == 'docker'

- name: Run post-deploy verification
  ansible.builtin.import_tasks: verify.yml
