[package]
name = "open-pubusb-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tonic = { workspace = true, features = ["router", "transport"] }
tonic-prost = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
pbjson = { workspace = true }
pbjson-types = { workspace = true }
serde = { workspace = true }

[build-dependencies]
tonic-prost-build = { workspace = true }
pbjson-build = { workspace = true }
protox = { workspace = true }

# `cargo machete` flags every [dependencies] entry above as unused: it only
# scans src/lib.rs, which is just re-exports — the real consumer is the
# tonic-prost-build/pbjson-build generated code under OUT_DIR (build.rs),
# invisible to a source-tree scan. All genuinely required.
[package.metadata.cargo-machete]
ignored = ["tonic", "tonic-prost", "prost", "prost-types", "pbjson", "pbjson-types", "serde"]
